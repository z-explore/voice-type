name: Windows portable package

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps
        run: |
          python -m pip install --upgrade pip wheel
          pip install -r requirements-windows.txt
          pip install pyinstaller
      - name: Download model
        run: python scripts/download_model.py
      - name: Freeze app
        run: pyinstaller --noconfirm --clean packaging/windows/voice-type.spec
      - name: Stage portable folder
        shell: pwsh
        run: |
          $out = "dist/voice-type-windows"
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          Copy-Item -Recurse dist/voice-type/* $out/
          Copy-Item config.example.toml "$out/config.toml"
          Copy-Item -Recurse models "$out/models"
          Copy-Item packaging/windows/Install.ps1 "$out/Install.ps1"
          Copy-Item packaging/windows/README.txt "$out/README.txt"
          # Ensure no Linux-only scripts leak into the zip
          Get-ChildItem $out -Recurse -Include *.sh,*.desktop,*.service | Remove-Item -Force -ErrorAction SilentlyContinue
      - name: Zip
        shell: pwsh
        run: Compress-Archive -Path dist/voice-type-windows -DestinationPath dist/voice-type-windows.zip -Force
      - uses: actions/upload-artifact@v4
        with:
          name: voice-type-windows
          path: dist/voice-type-windows.zip
      - name: Upload to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/voice-type-windows.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
