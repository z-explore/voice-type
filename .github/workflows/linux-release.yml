name: Linux portable package

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: System libs for sounddevice / build
        run: |
          sudo apt-get update
          sudo apt-get install -y libportaudio2 portaudio19-dev python3-dev gcc bzip2
      - name: Install deps
        run: |
          python -m pip install --upgrade pip wheel
          pip install -r requirements.txt
          pip install pyinstaller
      - name: Download model
        run: python scripts/download_model.py
      - name: Freeze app
        run: pyinstaller --noconfirm --clean packaging/linux/voice-type.spec
      - name: Stage portable folder
        run: |
          out=dist/voice-type-linux
          mkdir -p "$out"
          cp -a dist/voice-type/. "$out/"
          cp config.example.toml "$out/config.toml"
          cp -a models "$out/models"
          cp packaging/linux/install.sh "$out/install.sh"
          cp packaging/linux/README.txt "$out/README.txt"
          chmod +x "$out/voice-type" "$out/install.sh"
          # Strip any Windows leftovers if present
          find "$out" \( -name '*.ps1' -o -name '*.bat' -o -name '*.exe' \) -delete
      - name: Tarball
        run: |
          tar -C dist -czf dist/voice-type-linux.tar.gz voice-type-linux
      - uses: actions/upload-artifact@v4
        with:
          name: voice-type-linux
          path: dist/voice-type-linux.tar.gz
      - name: Upload to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/voice-type-linux.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
